name: Stock project research-resume gate mirror

on:
  pull_request:
    paths:
      - "PROJECT_RESEARCH_RESUME_GATE.md"
      - "data/research_resume_gate_status.json"
      - "scripts/check_research_resume_gate.py"
      - "tests/test_research_resume_gate.py"
      - ".github/workflows/research_resume_gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-resume-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Compile gate mirror
        run: python -m compileall -q scripts tests
      - name: Run gate mirror tests
        run: python -m unittest tests.test_research_resume_gate -v
      - name: Verify infrastructure remediation remains allowed
        run: |
          python scripts/check_research_resume_gate.py \
            --state data/research_resume_gate_status.json \
            --action BRIDGE_MAINTENANCE \
            --output /tmp/bridge-maintenance-gate.json
      - name: Verify research consumption remains blocked
        shell: bash
        run: |
          set +e
          python scripts/check_research_resume_gate.py \
            --state data/research_resume_gate_status.json \
            --action HISTORICAL_RESEARCH \
            --output /tmp/bridge-research-gate.json
          rc=$?
          set -e
          test "$rc" = 10
          python - <<'PY'
          import json
          report=json.load(open('/tmp/bridge-research-gate.json'))
          assert report['gate_status']=='BLOCKED_PREWORK'
          assert report['action_allowed'] is False
          assert report['may_authorize_orders'] is False
          PY

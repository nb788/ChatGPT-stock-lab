name: Validate Synthetic Core

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/validate_synthetic_core.py"
      - ".github/workflows/validate_synthetic_core.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install pinned dependencies
        run: pip install pandas==3.0.5 numpy==2.5.2
      - name: Run frozen-mechanics and failure-injection tests
        run: python tests/validate_synthetic_core.py

name: Update SEC S&P Share Facts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-6"
  push:
    paths:
      - "scripts/build_sec_shares.py"
      - "scripts/audit_sec_shares.py"
      - "scripts/resolve_current_share_exceptions.py"
      - "scripts/audit_all_current_filing_shares.py"
      - "scripts/build_current_share_events.py"
      - "tests/validate_strategy_data.py"
      - ".github/workflows/update_sec_shares.yml"

concurrency:
  group: sec-share-bridge-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install pinned dependencies
        run: pip install pandas==3.0.5 numpy==2.5.2 requests==2.34.2 beautifulsoup4==4.15.0 lxml==6.1.2
      - name: Build compact SEC share-facts dataset
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/build_sec_shares.py
      - name: Audit SEC share-facts dataset
        run: python scripts/audit_sec_shares.py
      - name: Resolve current share exceptions from filing-level XBRL
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/resolve_current_share_exceptions.py
      - name: Audit all current constituents at filing level
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/audit_all_current_filing_shares.py
      - name: Build rolling accepted share events
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/build_current_share_events.py
      - name: Run adversarial architecture and failure-injection tests
        run: python tests/validate_strategy_data.py
      - name: Commit updated public-data outputs
        run: |
          git config user.name "sec-shares-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update SEC share facts and QA $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

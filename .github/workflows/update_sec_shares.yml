name: Update SEC S&P Share Facts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-6"
  push:
    paths:
      - "scripts/build_sec_shares.py"
      - "scripts/audit_sec_shares.py"
      - ".github/workflows/update_sec_shares.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Build compact SEC share-facts dataset
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/build_sec_shares.py
      - name: Audit SEC share-facts dataset
        run: python scripts/audit_sec_shares.py
      - name: Commit updated public-data outputs
        run: |
          git config user.name "sec-shares-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update SEC share facts and QA $(date -u +%F)"
            git push
          fi

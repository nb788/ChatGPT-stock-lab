name: Check live SEC close delta

on:
  workflow_dispatch:
  schedule:
    # Redundant close-window slots mitigate GitHub schedule delays. A New York
    # local-time guard below rejects irrelevant UTC/DST slots.
    - cron: "*/15 20-22 * * 1-5"
  push:
    paths:
      - "scripts/build_live_sec_delta.py"
      - ".github/workflows/check_sec_live_delta.yml"
      - "data/close_trigger.json"

concurrency:
  group: sec-live-delta-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Determine whether this is a valid New York close-window run
        id: slot
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          event=os.environ.get('GITHUB_EVENT_NAME','')
          ny=datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York'))
          mins=ny.hour*60+ny.minute
          # Push/dispatch is the deterministic close-task trigger. Scheduled
          # redundancy is accepted only during the post-close maintenance window.
          ok=(event!='schedule') or (ny.weekday()<5 and 16*60+15 <= mins <= 18*60)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run_delta={'true' if ok else 'false'}\n")
              f.write(f"ny_time={ny.isoformat()}\n")
          print({'event':event,'ny_time':ny.isoformat(),'run_delta':ok})
          PY
      - name: Install pinned dependencies
        if: steps.slot.outputs.run_delta == 'true'
        run: pip install pandas==3.0.5 numpy==2.5.2 requests==2.34.2 beautifulsoup4==4.15.0 lxml==6.1.2
      - name: Check and parse live SEC filings since bulk snapshot
        if: steps.slot.outputs.run_delta == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: PYTHONPATH=scripts python scripts/build_live_sec_delta.py
      - name: Enforce same-date freshness and complete transport
        if: steps.slot.outputs.run_delta == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          q=json.load(open('data/qa_live_delta_summary.json'))
          today=datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          checked=str(q.get('checked_at_utc',''))
          if not checked:
              raise SystemExit('missing checked_at_utc')
          checked_date=datetime.fromisoformat(checked.replace('Z','+00:00')).astimezone(ZoneInfo('America/New_York')).date().isoformat()
          assert checked_date == today, (checked_date,today)
          assert int(q.get('api_failures',0)) == 0
          assert int(q.get('filing_fetch_failures',0)) == 0
          print({'freshness_date_et':checked_date,'current_ciks_checked':q.get('current_ciks_checked'),'unresolved_affected_events':q.get('unresolved_affected_events')})
          PY
      - name: Commit freshness outputs
        if: steps.slot.outputs.run_delta == 'true'
        run: |
          git config user.name "sec-shares-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sec_live_delta_filings.csv data/sec_live_share_events.csv data/qa_live_delta_*.csv data/qa_live_delta_summary.json
          if git diff --cached --quiet; then
            echo "No live-delta content changes; freshness metadata already current."
          else
            git commit -m "Update live SEC delta $(date -u +%FT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
